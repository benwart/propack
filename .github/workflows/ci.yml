name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: make test

      - name: Build ProPack.app bundle
        run: make app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG installer
        run: make dmg
