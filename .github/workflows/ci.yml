name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check uv lockfile consistency
        run: uv lock --check

      - name: Build offline documentation
        run: uv run --group docs mkdocs build --strict

      - name: Run unit test suite
        run: make test

      - name: Build ProPack.app bundle
        run: make app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG installer
        run: make dmg
