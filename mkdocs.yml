site_name: ProPack Documentation
site_description: Documentation for ProPack - ProPresenter Playlist Pack Exporter (macOS Native)
site_author: Ben Wart
site_url: https://benwart.github.io/propack/
repo_url: https://github.com/benwart/propack
repo_name: benwart/propack

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # Default to Dark Mode (Slate)
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode toggle option
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - def_list

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Technical Specifications:
      - Port Detection: specs/port-detection.md
      - Library Discovery: specs/library-discovery.md
      - Export & Packaging: specs/export-packaging.md
      - Import Pipeline: specs/import-pipeline.md
      - REST API Reference: specs/api-reference.md
      - Building & Code Signing: specs/distribution-signing.md
  - Development & Contributing: development.md
